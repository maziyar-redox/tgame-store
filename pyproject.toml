[project]
name = "tgame"
version = "0.0.1"
description = ""
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "cachetools>=7.2.4",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.148.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-redis>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pyrate-limiter[all]>=4.5.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.5",
    "sqlmodel>=0.0.48",
]

[tool.uv]
required-version = ">=0.13.0"

[tool.typos.default.extend-identifiers]
alls = "alls"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tgame/app*"]

[project.scripts]
fastapi-production-api = "fastapi_production_api:main"
fastapi-production-worker = "app.workers.outbox:main"
fastapi-production-cache = "app.commands.oidc_cache:main"

[tool.fastapi]
entrypoint = "tgame.app.main:app"

[build-system]
requires = ["uv_build>=0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["tgame"]

[tool.pytest.ini_options]
testpaths = ["tgame"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["tgame/app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tgame/app/alembic/env.py" = ["F401"]

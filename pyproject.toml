[project]
name = "tgame"
version = "0.0.1"
description = ""
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "cachetools>=7.2.4",
    "fastapi[standard]>=0.148.0",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.48",
]

[tool.typos.default.extend-identifiers]
alls = "alls"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tgame*"]

[tool.fastapi]
entrypoint = "tgame.app:app"

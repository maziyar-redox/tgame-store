# lefthook.yml
min_version: 1.5.0

pre-commit:
    parallel: false
    commands:
        biome-check-lint:
            glob: "frontend/web/**/*.{ts,tsx}"
            root: "frontend/web/"
            run: npm run lint {staged_files}
            stage_fixed: true

commit-msg:
    commands:
        commitlint:
            run: npx commitlint --edit {1}

pre-push:
    parallel: false
    commands:
        typecheck-web:
            glob: "frontend/web/**/*.{ts,tsx}"
            run: npx tsc --noEmit -p frontend/web/tsconfig.json
        build-web:
            glob: "frontend/web/**/*.{ts,tsx}"
            run: rm -rf frontend/web/.next && npx turbo run @frontend/web#build